[package]
name = "orchis-redis"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { version = "1.11.1", features = ["serde"] }
fred = { version = "10.1.0", features = ["subscriber-client", "i-all"] }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }
orchis-core = { version = "0.1.0", path = "../orchis-core" }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["time", "sync", "rt"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt", "macros"] }
